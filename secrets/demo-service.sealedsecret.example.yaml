# SealedSecret example (values below are placeholders, NOT real ciphertext).
# Encrypted with kubeseal against the in-cluster controller's public key:
#   kubeseal --format yaml < secret.yaml > demo-service.sealedsecret.yaml
# Safe to commit: only the controller inside the cluster can decrypt it.
# This model replaced plaintext `helm --set` secret injection after a
# security review flagged credential exposure in CI logs and Argo CD UI.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: demo-service-secrets
  namespace: demo-service
spec:
  encryptedData:
    DATABASE_URL: AgB4EXAMPLEONLYNOTREALCIPHERTEXT...
    API_KEY: AgCkEXAMPLEONLYNOTREALCIPHERTEXT...
  template:
    metadata:
      name: demo-service-secrets
      namespace: demo-service
