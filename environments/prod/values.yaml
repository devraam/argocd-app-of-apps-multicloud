# PROD values — HA replicas, right-sized resources, strict probes.
replicaCount: 3
image:
  tag: "1.4.0"
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: 500m, memory: 512Mi }
ingress:
  enabled: true
  className: nginx
  tls: true
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
logLevel: info
