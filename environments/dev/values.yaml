# DEV values — smaller footprint, verbose logging, relaxed probes.
replicaCount: 1
image:
  tag: "1.4.2"
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 250m, memory: 256Mi }
ingress:
  enabled: true
  className: nginx
  tls: true                 # cert-manager issues certificates
logLevel: debug
